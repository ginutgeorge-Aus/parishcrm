# SonarQube Cloud analysis, run from the CI workflow (not Automatic Analysis —
# that must stay off in the project settings or the CI scan is rejected).
sonar.organization=ginutgeorge-aus
sonar.projectKey=ginutgeorge-Aus_parishcrm

sonar.sources=src
sonar.tests=__tests__,src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/lib/generated/**,src/components/ui/**
sonar.coverage.exclusions=**/*.d.ts

# Jest writes this when run with --coverage (see jest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
