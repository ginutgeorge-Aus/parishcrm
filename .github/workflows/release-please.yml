name: Release

# Manual only — nothing releases on merge. Run from Actions → Release → Run workflow:
#   1st run: opens/updates the "chore(main): release x.y.z" PR (package.json bump +
#            CHANGELOG.md from conventional-commit PR titles since the last release).
#   Merge that PR when ready.
#   2nd run: tags vX.Y.Z, creates the GitHub release, and publishes the container image.
#
# The release PR is opened by GITHUB_TOKEN, so CI does not auto-run on it —
# close + reopen it (or push an empty commit to its branch) to trigger checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Dispatch from any other ref would tag/publish off the wrong commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish-image.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag_name }}

  # Sigstore-signed source tarball on every release (Scorecard Signed-Releases).
  # Verify:  cosign verify-blob parishcrm-<tag>.tar.gz \
  #            --bundle parishcrm-<tag>.tar.gz.sigstore.json \
  #            --certificate-identity-regexp '^https://github.com/<owner>/parishcrm/' \
  #            --certificate-oidc-issuer https://token.actions.githubusercontent.com
  sign-source:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="parishcrm-${TAG}.tar.gz"
          # Re-run of a finished job: keep the published, already-signed assets.
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$f.sigstore.json"; then
            echo "$TAG already signed"; exit 0
          fi
          # Never --clobber: after a partial upload, sign the published archive.
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$f"; then
            gh release download "$TAG" -p "$f"
            upload=("$f.sigstore.json")
          else
            git archive --format=tar.gz --prefix="parishcrm-${TAG}/" -o "$f" HEAD
            upload=("$f" "$f.sigstore.json")
          fi
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          gh release upload "$TAG" "${upload[@]}"
