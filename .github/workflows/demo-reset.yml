name: demo-reset

# Nightly wipe + reseed of the public live demo (docs/live-demo.md), then
# redeploy it on Render so the app reconnects to a clean database.
on:
  schedule:
    - cron: '0 17 * * *' # 03:00 AEST / 04:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    # Forks have no demo secrets.
    if: github.repository == 'ginutgeorge-Aus/parishcrm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Seed and deploy the same release. Fail (demo keeps last night's data)
      # if that release's image never reached GHCR, e.g. a failed publish.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          image="ghcr.io/${REPO,,}:${tag}"
          docker manifest inspect "$image" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      # No secrets in this step: install scripts must not see the demo DB.
      - run: npm ci --no-audit --no-fund
      - name: Reset and seed
        env:
          # Neon DIRECT (unpooled) URL: `migrate reset` needs a session-level
          # connection. The Render app uses the pooled URL for the same database.
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.DEMO_ENCRYPTION_KEY }}
          DEMO_MODE: 'true'
          ALLOW_DEMO_SEED: 'true'
        run: |
          npx prisma migrate reset --force
          npm run db:seed
          npm run demo:seed
      # imgURL pins Render to the image of the release just seeded.
      - name: Redeploy demo
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: curl -fsS -X POST -G "$HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
      # The hook only queues the deploy. Fail the run unless the demo ends up
      # serving the seeded release: the login page prints "CRM · <version>".
      # Needs no Render API key (account-wide). If the release was already
      # live, this passes at once even if the redeploy itself failed; the
      # schema still matches the seed, so that case is harmless.
      - name: Wait for demo to serve the release
        env:
          DEMO_URL: ${{ vars.DEMO_URL || 'https://parishcrm-demo.onrender.com' }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          url="${DEMO_URL%/}/login"
          deadline=$((SECONDS + 720))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsSL -m 60 "$url" 2>/dev/null) || true
            if grep -qF "· ${TAG}</p>" <<<"$body"; then
              echo "Demo is serving $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Demo not serving $TAG at $url after 12 min; check the Render deploy log"
          exit 1
