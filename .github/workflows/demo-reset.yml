name: demo-reset

# Nightly wipe + reseed of the public live demo (docs/live-demo.md), then
# redeploy it on Render so the app reconnects to a clean database.
on:
  schedule:
    - cron: '0 17 * * *' # 03:00 AEST / 04:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    # Forks have no demo secrets.
    if: github.repository == 'ginutgeorge-Aus/parishcrm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Seed and deploy the same release. Fail (demo keeps last night's data)
      # if that release's image never reached GHCR, e.g. a failed publish.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          image="ghcr.io/${REPO,,}:${tag}"
          docker manifest inspect "$image" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      # No secrets in this step: install scripts must not see the demo DB.
      - run: npm ci --no-audit --no-fund
      # `migrate reset` erases whatever database DEMO_DATABASE_URL points at.
      # Refuse unless (1) its host equals repo variable DEMO_DB_HOST and (2) the
      # DB is empty or carries the sentinel that seed-demo.ts writes. The URL
      # is never echoed. Needs psql (preinstalled on ubuntu-latest).
      - name: Guard - target must be the demo database
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.DEMO_DB_HOST }}
        run: |
          if [ -z "$EXPECTED_HOST" ]; then
            echo "::error::Repo variable DEMO_DB_HOST is not set; refusing to wipe a database"
            exit 1
          fi
          host=$(node -e 'try { process.stdout.write(new URL(process.env.DATABASE_URL).hostname) } catch { process.exit(1) }') || {
            echo "::error::DEMO_DATABASE_URL is not a valid URL"
            exit 1
          }
          if [ "$host" != "$EXPECTED_HOST" ]; then
            echo "::error::DEMO_DATABASE_URL host does not match DEMO_DB_HOST; refusing to wipe"
            exit 1
          fi
          has_table=$(psql "$DATABASE_URL" -tAX -c "SELECT to_regclass('public.\"AppSetting\"') IS NOT NULL")
          if [ "$has_table" = "t" ]; then
            has_sentinel=$(psql "$DATABASE_URL" -tAX -c "SELECT EXISTS (SELECT 1 FROM \"AppSetting\" WHERE key = 'demoSentinel' AND value = 'true')")
            if [ "$has_sentinel" != "t" ]; then
              echo "::error::Database has no demoSentinel in AppSetting; not the demo DB, refusing to wipe"
              exit 1
            fi
          else
            # No AppSetting: only a completely empty public schema may be wiped
            # (migrate reset drops the whole schema, other tables included).
            tables=$(psql "$DATABASE_URL" -tAX -c "SELECT count(*) FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p','v','m','f','S')")
            if [ "$tables" != "0" ]; then
              echo "::error::Database has no AppSetting table but is not empty; not the demo DB, refusing to wipe"
              exit 1
            fi
          fi
          echo "Guard passed: host matches and database is the demo DB (or empty)"
      - name: Reset and seed
        env:
          # Neon DIRECT (unpooled) URL: `migrate reset` needs a session-level
          # connection. The Render app uses the pooled URL for the same database.
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.DEMO_ENCRYPTION_KEY }}
          DEMO_MODE: 'true'
          ALLOW_DEMO_SEED: 'true'
        run: |
          npx prisma migrate reset --force
          # reset erased the sentinel; restore it now so a failed seed below
          # cannot leave a non-empty DB that tomorrow's guard rejects.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAX -c "INSERT INTO \"AppSetting\" (key, value) VALUES ('demoSentinel', 'true') ON CONFLICT (key) DO UPDATE SET value = 'true'"
          npm run db:seed
          npm run demo:seed
      # imgURL pins Render to the image of the release just seeded.
      - name: Redeploy demo
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: curl -fsS -X POST -G "$HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
      # The hook only queues the deploy. Fail the run unless the demo ends up
      # serving the seeded release: the login page prints "CRM · <version>".
      # Needs no Render API key (account-wide). If the release was already
      # live, this passes at once even if the redeploy itself failed; the
      # schema still matches the seed, so that case is harmless.
      - name: Wait for demo to serve the release
        env:
          DEMO_URL: ${{ vars.DEMO_URL || 'https://parishcrm-demo.onrender.com' }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          url="${DEMO_URL%/}/login"
          deadline=$((SECONDS + 720))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl -fsSL -m 60 "$url" 2>/dev/null) || true
            if grep -qF "· ${TAG}</p>" <<<"$body"; then
              echo "Demo is serving $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Demo not serving $TAG at $url after 12 min; check the Render deploy log"
          exit 1
