name: Semgrep

# Repo rules (.semgrep/rules.yml) + community TypeScript/React rules.
# Findings fail the job and are uploaded to Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Hash-locked (Scorecard Pinned-Dependencies). Regenerate after editing semgrep.in:
      #   uv pip compile --python-version 3.13 --python-platform x86_64-manylinux_2_28 \
      #     --generate-hashes --no-header .github/requirements/semgrep.in -o .github/requirements/semgrep.txt
      - run: pip install --require-hashes -r .github/requirements/semgrep.txt
      - name: Scan
        run: >-
          semgrep scan --metrics=off --error
          --config .semgrep/rules.yml --config p/typescript --config p/react
          --exclude src/lib/generated
          --sarif-output=semgrep.sarif --text
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
