name: Dependency review

# Blocks PRs that add a dependency with a known vulnerability (moderate+) or a
# licence outside the AGPL-3.0-compatible allowlist below.
# CodeQL runs via the repo's code-scanning "default setup", not a workflow.
# CodeQL runs via repo "default setup" (Settings → Code security), not a workflow.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
            Zlib, Unlicense, CC0-1.0, CC-BY-3.0, CC-BY-4.0, BlueOak-1.0.0,
            Python-2.0, MPL-2.0, LGPL-2.1-or-later, LGPL-3.0-only,
            LGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only,
            AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
