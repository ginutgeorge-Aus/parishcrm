name: Dependency review

# Blocks PRs that add a dependency with a known vulnerability (moderate+) or a
# licence incompatible with AGPL-3.0 distribution.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: SSPL-1.0, BUSL-1.1, Commons-Clause
          comment-summary-in-pr: on-failure
