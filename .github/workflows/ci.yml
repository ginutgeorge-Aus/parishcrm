name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  # No paths-ignore on PRs: CI is a required check, and a skipped required
  # check blocks docs-only PRs from merging.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static checks, build and tests run as parallel jobs; `checks` below is the
  # single required status that aggregates them (ruleset requires "checks").
  # Docs-only PRs (every changed file is *.md or under docs/) skip the heavy
  # jobs. Job-level `if` skips report as passing for required checks, unlike
  # a workflow-level paths-ignore, which would leave them pending forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # PR merge commit: HEAD^1 is the base branch tip
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            # --no-renames lists both sides of a move, so src/x -> docs/x counts as code.
            # A failing diff keeps code=true (fail open to the full suite).
            # -z (NUL-delimited) keeps non-ASCII paths unquoted; git otherwise prints "docs/fran\303\247ais.md".
            if git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"; then
              if ! grep -zEv '\.md$|^docs/' "$RUNNER_TEMP/changed.z" | grep -qz .; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run knip

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      # No env needed: `next build` never reads runtime config (src/lib/envCheck.ts
      # runs at boot only).
      - run: npm run build

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  checks:
    needs: [changes, static, build, tests, migrations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All parallel jobs passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "code=$CODE results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac
          # Skips are only legitimate for a docs-only PR (code=false).
          if [ "$CODE" != "false" ]; then
            case " $RESULTS " in *" skipped "*) exit 1;; esac
          fi

  # Separate job so `id-token: write` never coexists with `npm ci` install
  # scripts, which could otherwise mint a Codecov-audience OIDC token.
  codecov:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      # Fork PRs get no OIDC token, so the upload fails there; non-fatal.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  # Same isolation as codecov: SONAR_TOKEN never shares a job with `npm ci`.
  sonarqube:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame / new-code detection
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      # Fork PRs and Dependabot get no SONAR_TOKEN, so the scan is skipped
      # there rather than failing. (A step's own env isn't visible to its
      # `if`, hence the probe step.)
      - id: sonar
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Self-hosters install from prisma/migrations. Prove the migrations build the
  # exact schema.prisma database: apply them to an empty Postgres, then diff the
  # result against the schema. Any drift (a schema edit with no migration) fails.
  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parishcrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parishcrm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy
      - name: Migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script --exit-code
      # Same disposable database: race tests that need real Postgres Serializable
      # behaviour (__tests__/integration, skipped in the normal test job).
      - name: Integration tests (real Postgres)
        run: |
          ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export ENCRYPTION_KEY
          npm test -- --testPathPatterns="__tests__/integration/"
        env:
          INTEGRATION_DB: '1'
