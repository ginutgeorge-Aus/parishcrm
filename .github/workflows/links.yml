name: Link check

# Weekly broken-link check over the README, docs/ and website docs. Opens (or
# updates) one "Broken links" issue when something fails.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Site-absolute links (/parishcrm/...) are validated at build time by
      # starlight-links-validator, so they are excluded here (lychee resolves them to file:// URLs under the root dir first).
      - id: repo
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 8 --accept 200,206,429
            --root-dir ${{ github.workspace }}
            --exclude '^file://${{ github.workspace }}/parishcrm/'
            README.md CONTRIBUTING.md 'docs/**/*.md'
            'website/src/content/docs/**/*.md'
          output: lychee-repo.md
          fail: false
      - name: Open or update issue
        if: steps.repo.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat lychee-repo.md > lychee-report.md
          n=$(gh issue list --state open --search 'in:title "Broken links"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file lychee-report.md
          else gh issue create --title "Broken links" --body-file lychee-report.md; fi
