name: Gemini re-review

# Gemini Code Assist reviews a PR when it opens (.gemini/config.yaml) but has no
# setting to review later pushes. This posts `/gemini review` after each push to
# an open same-repo PR so the latest head gets reviewed too. PR label
# `no-gemini` = skip. Drafts and Dependabot PRs are skipped.
#
# pull_request_target (not pull_request) so the run's ref is main: the PAT lives
# in environment `coderabbit-nudge` (deployment branches: main only), shared with
# the CodeRabbit nudge — the app ignores commands from bots, so github.token
# can't be used. Nothing from the PR is checked out or executed; the job only
# posts a fixed comment. Forks are skipped (repo guard).
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] no checkout, fixed comment only
    types: [synchronize]

permissions: {}

jobs:
  rereview:
    if: >-
      github.repository == 'ginutgeorge-Aus/parishcrm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-gemini')
    # A burst of pushes cancels the waiting run, so only the last push is reviewed.
    concurrency:
      group: gemini-rereview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment: coderabbit-nudge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request Gemini review
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_NUDGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CODERABBIT_NUDGE_PAT not set — see the header of this workflow."
            exit 1
          fi
          sleep 120   # debounce follow-up pushes
          # Recheck: the PR may have been closed, drafted, labelled or retargeted during the wait.
          state=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft,labels,baseRefName \
            --jq '"\(.state) \(.isDraft) \(.baseRefName) \([.labels[].name] | index("no-gemini") != null)"')
          if [ "$state" != "OPEN false main false" ]; then
            echo "PR no longer eligible ($state) — skipping."
            exit 0
          fi
          gh pr comment "$PR" --repo "$REPO" --body "/gemini review"
