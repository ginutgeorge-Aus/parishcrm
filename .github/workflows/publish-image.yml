name: Publish image

# Build the container image, scan it, push to GHCR with an SBOM + signed build
# provenance. The image is config-agnostic — every church sets its own env at
# runtime (see .env.example and docs/self-hosting.md).
#
# Trigger: called by release-please.yml when a release is cut. There is
# deliberately no `push: tags` trigger: a pushed v* tag would publish a signed
# image and move :latest with no tests and no check that it is on main.
# A released version is immutable: the build fails if the tag already exists in GHCR.
#
# Verify an image:  gh attestation verify oci://ghcr.io/<owner>/parishcrm:<tag> --repo <owner>/parishcrm
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Only commits that are on main may be published. Checks the tag's commit
      # (HEAD after checkout), not github.sha, which is the caller's ref.
      - name: Require tag commit to be on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}" || {
            echo "::error::$(git rev-parse HEAD) is not an ancestor of ${DEFAULT_BRANCH}; refusing to publish"
            exit 1
          }
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set lowercase image name
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Released versions are immutable: never overwrite an existing :TAG with a
      # non-identical rebuild. Only "no such manifest" means free to publish; any
      # other error (auth, network) fails closed.
      - name: Fail if the tag is already published
        run: |
          if out=$(docker manifest inspect "${IMAGE}:${TAG}" 2>&1); then
            echo "::error::${IMAGE}:${TAG} already exists; released versions are immutable"
            exit 1
          fi
          grep -qiE 'no such manifest|manifest unknown|not found' <<<"$out" || {
            echo "::error::Could not check ${IMAGE}:${TAG}: $out"
            exit 1
          }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build + load locally so the image is scanned BEFORE it reaches the registry.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            APP_VERSION=${{ env.TAG }}
            GIT_SHA=${{ env.GIT_SHA }}

      - name: Scan image with Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan image with Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true

      - if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # Same builder, so this reuses the cached layers from the scanned build.
      - name: Push image (with SBOM + provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ env.TAG }}
            GIT_SHA=${{ env.GIT_SHA }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
