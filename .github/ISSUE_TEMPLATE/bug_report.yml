name: Bug report
description: Something in the CRM is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For **security vulnerabilities**, do NOT open an issue —
        report privately as described in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected instead.
      placeholder: When I click X, Y happens. I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /families
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Families / People
        - Events
        - Accounting
        - Petty cash
        - Auth / login
        - Receipts / email
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      options:
        - ADMIN
        - PASTOR
        - OFFICE_ADMIN
        - AUDITOR
        - VIEWER
        - Public (no login)
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Browser, device, and roughly when it happened. Do not paste passwords or member PII.
      placeholder: Chrome on iPhone, ~2pm today
    validations:
      required: false
