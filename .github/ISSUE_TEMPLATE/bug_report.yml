name: Bug report
description: Something in the CRM is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For **security vulnerabilities**, do NOT open an issue —
        report privately as described in [SECURITY.md](https://github.com/ginutgeorge-Aus/parishcrm/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected instead.
      placeholder: When I click X, Y happens. I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /families
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Families / People
        - Membership
        - Events / Ticketing
        - Accounting
        - Petty cash
        - Receipts / email
        - Reports
        - Auth / login
        - Settings / configuration
        - Install / upgrade / deployment
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      options:
        - ADMIN
        - PASTOR
        - OFFICE_ADMIN
        - AUDITOR
        - VIEWER
        - Public (no login)
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ParishCRM version
      description: Release tag or commit SHA you are running.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Docker / docker compose
        - Node (npm start)
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Node and PostgreSQL versions, OS/host, browser and device.
      placeholder: |
        Node 24.x, PostgreSQL 16, Ubuntu 24.04
        Chrome on iPhone
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant server or browser console output. Remove secrets, tokens,
        passwords and member personal data before pasting.
      render: shell
    validations:
      required: false
